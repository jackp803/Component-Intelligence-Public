schema_version: '1.0'
plan:
  id: COMPONENT-INTELLIGENCE-V01
  project_id: component-intelligence
  name: Component Intelligence System Development Plan（元件智慧資料系統開發計畫）— Model-Agnostic
  version: 2
  source_of_truth:
  - docs/spec/Component_Intelligence_System_Master_Spec_v0.1.md
  - docs/spec/Component_Intelligence_System_Worker_Task_Spec_v0.2.md
policy:
  execution_mode: sequential
  max_workers: 1
  stop_on_final_failure: true
  stop_on_human_gate: true
  require_artifact_dependencies: true
  disallow_model_pinning: true
  worker_context_mode: current_task_plus_required_artifacts_and_relevant_sources
  actor_selection: external_skill_or_runtime
  task_defines_work_not_actor: true
