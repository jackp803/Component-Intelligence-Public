- tasks/phase-07-enricher.yaml
- tasks/phase-08-document-pdf.yaml
- tasks/phase-09-extraction.yaml
- tasks/phase-10-normalizer.yaml
- tasks/phase-11-verification.yaml
- tasks/phase-12-ir-persistence.yaml
- tasks/phase-13-cache.yaml
- tasks/phase-14-e2e.yaml
validation_profiles_source: validation/profiles.yaml
