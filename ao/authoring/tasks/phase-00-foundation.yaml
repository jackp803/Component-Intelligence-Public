  title: 建立 ComponentIntelligence 專案骨架
  objective: 建立主專案與測試專案目錄，不實作功能。
  non_goals:
  - 不得加入網路套件
  - 不得建立真實 Resolver
  - 不得建 SQLite schema
  - 不實作網路功能。
  - 不實作 AI。
  - 不得自行執行下一個 Task。
  dependencies: []
  inputs:
    references:
    - docs/spec/Component_Intelligence_System_Master_Spec_v0.1.md
    - docs/spec/Component_Intelligence_System_Worker_Task_Spec_v0.2.md
  source_of_truth:
  - docs/spec/Component_Intelligence_System_Master_Spec_v0.1.md
  - docs/spec/Component_Intelligence_System_Worker_Task_Spec_v0.2.md
  execution_scope:
    allowed_roots: &id001
    - src/ComponentIntelligence/
    - tests/ComponentIntelligence.Tests/
    protected:
    - .git/**
    - docs/spec/**
    - docs/source_of_truth/**
    max_production_files_changed: 4
    max_test_files_changed: 3
  implementation:
    required_items:
    - ComponentIntelligence project
    - ComponentIntelligence.Tests project
    - 基本 folder layout
    - 專案引用
    - 初始 build
    spec_excerpt: 'GOAL：

      建立主專案與測試專案目錄，不實作功能。


      MUST COMPLETE：

      - ComponentIntelligence project

      - ComponentIntelligence.Tests project

      - 基本 folder layout

      - 專案引用

      - 初始 build


      FORBIDDEN：

      - 不得加入網路套件

      - 不得建立真實 Resolver

      - 不得建 SQLite schema


      ACCEPTANCE：

      - Solution build PASS

      - Test project 可執行


      ---'
  outputs:
    artifacts:
    - id: T001-result
      type: task_result
      required: true
  acceptance:
  - id: AC-001
    type: deterministic
    statement: Solution build PASS
  - id: AC-002
    type: deterministic
    statement: Test project 可執行
  - id: AC-003
    type: deterministic
    statement: 本 Task 的 production change 必須限制在 execution_scope.allowed_roots，且不得修改 protected 路徑。
  validation:
    profiles:
    - dotnet_build
    - dotnet_test_all
    all_must_pass: true
  retry:
    max_total_task_attempts: 3
  side_effects:
    level: LOCAL_REVERSIBLE
  priority: high
  stop_condition: Build 與本 Task 相關 deterministic tests 全部 PASS 後立即停止；不得自行開始下一 Task。
