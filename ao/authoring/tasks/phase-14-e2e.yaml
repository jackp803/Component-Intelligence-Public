    spec_excerpt: '所有主要模組回歸測試。


      FINAL GATE：


      ```text

      Excel:

      IFM | O5D100 | 4 | 5


      → Import

      → Spare = 1

      → Resolve

      → Official URL

      → Datasheet

      → Voltage

      → Output

      → Connector

      → Pin

      → Raw Data

      → Evidence

      → Normalize

      → Verify

      → Component IR

      → SQLite

      → Reload

      → Local Reuse

      ```


      ---


      # 19. Worker Model（執行模型） Task Packet Template（任務包模板）


      ```text

      TASK

      T0XX — <名稱>


      GOAL

      只完成 <單一功能>。


      CONTEXT

      本 Task 所需最小上下文。


      INPUT CONTRACT

      列出可以依賴的已完成資料結構／介面。


      OUTPUT CONTRACT

      列出本 Task 必須新增／修改的 public API。


      ALLOWED FILES

      只允許：

      - ...

      - ...


      FORBIDDEN

      - 不得執行下一 Task

      - 不得修改 Contract 除非本 Task 明確要求

      - 不得修改其他模組

      - 不得新增未要求的第三方套件

      - 不得刪除／放寬測試

      - 不得用 AI 猜工程資料


      ACCEPTANCE TESTS

      1. ...

      2. ...

      3. ...


      BUILD

      指定 build command。


      TEST

      指定 test command。


      STOP CONDITION

      上述 Build + Tests PASS 後立即停止並回報。

      ```


      ---


      # 20. Reviewer（審查模型）規則


      建議：

      - Selected Worker Model（由 Skill 選擇）：Implementation（實作）

      - Selected Reviewer Model（由 Skill 選擇）：Review（審查）


      Reviewer 只檢查：

      - Contract compliance（契約符合）

      - Scope compliance（範圍符合）

      - Tests

      - obvious bugs

      - hard-coded assumptions

      - accidental cross-module changes


      Reviewer 不得自行做大規模重構。


      ---


      # 21. AI Runtime Boundary（執行期 AI 邊界）


      AI 只處理：

      - 複雜 PDF

      - 圖片 Pinout

      - 歧義候選

      - 非結構化分類


      AI 輸出：

      `INFERRED`


      除非後續由可信 Evidence 證明，否則不得 `VERIFIED`。


      ---


      # 22. 最終開發哲學


      ```text

      Contract 先固定

      ↓

      小 Task 實作

      ↓

      Compiler

      ↓

      Unit Test

      ↓

      Reviewer

      ↓

      Gate

      ↓

      下一 Task

      ```


      而不是：


      ```text

      把整份規格丟給 Worker Model（執行模型）

      ↓

      叫它一次做完整系統

      ```


      系統架構不由 Worker Model（執行模型） 即興決定；Worker Model（執行模型） 的工作是忠實完成已定義的小型 Implementation Task（實作任務）。'
